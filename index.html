<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soccer Giphy Fetch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
</head>
<body class="bg-light">

  <div class="container text-center py-5">
    <h1 class="mb-4">Soccer GIF Finder</h1>
    <p class="text-muted">Click the button to load soccer gifs or search for something else.</p>

     <div class="d-flex justify-content-center mb-3">
      <input type="text" id="search-input" class="form-control w-50 me-2" placeholder="Search gifs (ex: Messi)">
      <button id="fetch-btn" class="btn btn-success">Fetch GIFs</button>
    </div>

    <div id="gif-container" class="row justify-content-center"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
